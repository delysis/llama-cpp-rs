name: Publish to Crates.io

on:
  release:
    types:
      - created
    workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Publish native bindings
        run: RUST_BACKTRACE=1 cargo publish --package llama-cpp-sys-2 --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --verbose
      - name: Publish safe wrapper after registry propagation
        run: |
          for attempt in $(seq 1 12); do
            RUST_BACKTRACE=1 cargo publish --package llama-cpp-2 --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --verbose && exit 0
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          exit 1
      # Trigger the 'update-toml-version' workflow
      - name: Dispatch Update TOML Version Event
        if: success()  # Ensure this runs only if the previous steps were successful
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.everest-preview+json" \
          "https://api.github.com/repos/${{ github.repository }}/dispatches" \
          -d '{"event_type": "trigger-update-toml-version"}'
