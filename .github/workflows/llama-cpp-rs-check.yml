name: Llama Cpp Rs Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  workflow-policy:
    name: Validate workflow policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject mutable actions and live host-key discovery
        run: ./scripts/check-workflow-policy.sh
      - name: Exercise workflow-policy fixtures
        run: ./tests/workflow_policy.sh
  check:
    name: Run Tests on LLama Cpp Rs
    needs: workflow-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential curl libssl-dev libclang-dev pkg-config cmake git
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - name: Reconciliation ledger
        run: ./scripts/check-reconciliation-ledger.sh
      - name: Clippy safe-wrapper feature surface
        run: >-
          cargo clippy -p llama-cpp-2 --all-targets --no-default-features
          --features common,sampler,mtmd
      - name: Fmt
        run: cargo fmt --check
      - name: Test safe-wrapper feature matrix
        run: |
          cargo test -p llama-cpp-2 --no-default-features
          cargo test -p llama-cpp-2 --no-default-features --features sampler
          cargo test -p llama-cpp-2 --no-default-features --features common,sampler,mtmd
      - name: Test native build evidence
        run: cargo test -p llama-cpp-sys-2 --test build-evidence
      - name: Test documentation
        run: cargo test --doc -p llama-cpp-2 --no-default-features --features common,sampler,mtmd
  cuda:
    name: Check the dedicated CUDA build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          file: test-build.Dockerfile
          target: base-cuda
          platforms: linux/amd64
          cache-from: type=gha,scope=llama-cpp-rs-cuda-amd64
          cache-to: type=gha,mode=max,scope=llama-cpp-rs-cuda-amd64
  mac:
    name: Check that it builds on mac
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
      - name: Build
        run: >-
          cargo build -p llama-cpp-2 --no-default-features
          --features common,sampler,mtmd,metal
  windows:
    name: Check that it builds on windows
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
      - name: Build
        run: cargo build --features sampler
      - name: Test
        run: cargo test --features sampler
